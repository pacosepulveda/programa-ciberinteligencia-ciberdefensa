listener 8883 0.0.0.0
cafile /etc/mosquitto/certs/telvora-root-ca.crt
certfile /etc/mosquitto/certs/mqtt.crt
keyfile /etc/mosquitto/certs/mqtt.key
allow_anonymous false
require_certificate true
use_identity_as_username true

# Current ACL extract
# analyst01 can read all telemetry
# codg-runtime can publish telemetry and control commands
acl_file /etc/mosquitto/codg.acl
